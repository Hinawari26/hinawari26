<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hinawari</title>
<link rel="icon" href="static/MARK ONLY TRANSPARENT BG.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --sq1: #c8a96e;
    --sq2: #7eb8b5;
    --sq3: #c97b7b;
    --sq4: #a07ec8;
    --text-light: rgba(255,255,255,0.85);
    --text-muted: rgba(255,255,255,0.35);
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --radius: clamp(12px, 2vw, 20px);
    --gap: clamp(16px, 3vw, 32px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); font-family: 'Cormorant Garamond', Georgia, serif; color: var(--text-light); overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.035; pointer-events: none; z-index: 9998; }

  #transition-overlay { position: fixed; inset: 0; background: #0a0a0f; z-index: 99999; pointer-events: none; opacity: 1; }

  .ambient { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite alternate; }
  .ambient-1 { width: 500px; height: 500px; top: -150px; left: -100px; background: rgba(200,169,110,0.07); }
  .ambient-2 { width: 400px; height: 400px; bottom: -100px; right: -80px; background: rgba(126,184,181,0.07); animation-delay: -9s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.1); } }

  .page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(32px,6vw,80px) clamp(20px,5vw,60px); gap: clamp(40px,6vh,72px); }

  .header { text-align: center; opacity: 0; transform: translateY(-24px); animation: fadeDown 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s forwards; }
  .header .eyebrow { font-family: 'Inconsolata', monospace; font-size: clamp(10px,1.5vw,13px); letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
  .header h1 { font-size: clamp(2.4rem,7vw,5.5rem); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .header h1 em { font-style: italic; background: linear-gradient(135deg, var(--sq1), var(--sq2), var(--sq3), var(--sq4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: var(--gap); width: 100%; max-width: 820px; }

  .card { aspect-ratio: 1; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--card-border); position: relative; overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; display: block; opacity: 0; transform: scale(0.82) translateY(30px); transition: transform 0.5s cubic-bezier(0.23,1,0.32,1), box-shadow 0.5s cubic-bezier(0.23,1,0.32,1), border-color 0.4s ease; }
  .card.visible { animation: popUp 0.75s cubic-bezier(0.16,1,0.3,1) forwards; }
  .card:nth-child(1) { --accent: var(--sq1); animation-delay: 0.3s; }
  .card:nth-child(2) { --accent: var(--sq2); animation-delay: 0.48s; }
  .card:nth-child(3) { --accent: var(--sq3); animation-delay: 0.62s; }
  .card:nth-child(4) { --accent: var(--sq4); animation-delay: 0.76s; }
  @keyframes popUp { 0% { opacity:0; transform:scale(0.82) translateY(30px); } 60% { opacity:1; transform:scale(1.03) translateY(-4px); } 80% { transform:scale(0.98) translateY(2px); } 100% { opacity:1; transform:scale(1) translateY(0); } }

  .card:hover { transform: scale(1.03) translateY(-6px); box-shadow: 0 24px 60px -10px color-mix(in srgb, var(--accent) 30%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .card:active { transform: scale(0.97); }
  .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%); transition: opacity 0.4s ease; opacity: 0.6; }
  .card:hover::before { opacity: 1; }
  .card::after { content: ''; position: absolute; top: 18px; right: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .card:hover::after { transform: scale(1.6); }

  #hinawari{width:30%}

  .card-inner { position: absolute; inset: 0; padding: clamp(20px,4vw,36px); display: flex; flex-direction: column; justify-content: flex-end; }
  .card-num { font-family: 'Inconsolata', monospace; font-size: clamp(9px,1.4vw,12px); letter-spacing: 0.2em; color: var(--accent); margin-bottom: 8px; opacity: 0.8; }
  .card-title { font-size: clamp(1.2rem,3vw,1.9rem); font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; }
  .card-sub { font-family: 'Inconsolata', monospace; font-size: clamp(10px,1.3vw,12px); color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

  .card-arrow { position: absolute; bottom: clamp(18px,3vw,28px); right: clamp(18px,3vw,28px); width: 32px; height: 32px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateX(-8px); transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.23,1,0.32,1); }
  .card-arrow svg { width: 12px; height: 12px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  .card-bg-num { position: absolute; top: -10px; right: 10px; font-size: clamp(6rem,16vw,11rem); font-weight: 600; line-height: 1; color: var(--accent); opacity: 0.06; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s ease; }
  .card:hover .card-bg-num { opacity: 0.12; transform: scale(1.05) translateY(-6px); }

  .card-line { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); transform: scaleX(0); transition: transform 0.5s cubic-bezier(0.23,1,0.32,1); transform-origin: left; }
  .card:hover .card-line { transform: scaleX(1); }

  .footer { text-align: center; opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 1.1s forwards; }
  .footer p { font-family: 'Inconsolata', monospace; font-size: clamp(10px,1.3vw,12px); color: var(--text-muted); letter-spacing: 0.12em; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  @media (max-width: 768px) { .grid { max-width: 600px; } }
  @media (max-width: 500px) { .grid { grid-template-columns:1fr 1fr; max-width:100%; } .card { aspect-ratio:0.9; } }
  @media (max-width: 360px) { .grid { grid-template-columns:1fr; } .card { aspect-ratio:1; max-width:280px; margin:0 auto; width:100%; } }
</style>
</head>
<body>
<div id="transition-overlay"></div>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<main class="page">
  <header class="header">
    <p class="eyebrow">Collection · 2026</p>
    <img src="static/TYPE ONLY TRANSPARENT BG.png" id="hinawari">
  </header>

  <section class="grid">
    <a href="altair.html" class="card" data-transition tabindex="0">
      <span class="card-bg-num">I</span>
      <div class="card-inner">
        <p class="card-num">01</p>
        <h2 class="card-title">ALTAIR</h2>
        <p class="card-sub">Aquila's Brightest Star</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 12 12"><path d="M2 6h8M7 3l3 3-3 3"/></svg></div>
      <div class="card-line"></div>
    </a>
    <a href="polaris.html" class="card" data-transition tabindex="0">
      <span class="card-bg-num">II</span>
      <div class="card-inner">
        <p class="card-num">02</p>
        <h2 class="card-title">POLARIS</h2>
        <p class="card-sub">The North Star</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 12 12"><path d="M2 6h8M7 3l3 3-3 3"/></svg></div>
      <div class="card-line"></div>
    </a>
    <a href="rigel.html" class="card" data-transition tabindex="0">
      <span class="card-bg-num">III</span>
      <div class="card-inner">
        <p class="card-num">03</p>
        <h2 class="card-title">RIGEL</h2>
        <p class="card-sub">Orion's Brightest Star</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 12 12"><path d="M2 6h8M7 3l3 3-3 3"/></svg></div>
      <div class="card-line"></div>
    </a>
    <a href="vega.html" class="card" data-transition tabindex="0">
      <span class="card-bg-num">IV</span>
      <div class="card-inner">
        <p class="card-num">04</p>
        <h2 class="card-title">VEGA</h2>
        <p class="card-sub">Lyra's Brightest Star</p>
      </div>
      <div class="card-arrow"><svg viewBox="0 0 12 12"><path d="M2 6h8M7 3l3 3-3 3"/></svg></div>
      <div class="card-line"></div>
    </a>
  </section>

  <footer class="footer"><p>click any square to explore</p></footer>
</main>

<script>
  const overlay = document.getElementById('transition-overlay');
  
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.style.transition = 'opacity 0.55s cubic-bezier(0.16,1,0.3,1)';
    overlay.style.opacity = '0';
  }));

  
  document.querySelectorAll('a[data-transition]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const href = link.href;
      overlay.style.transition = 'opacity 0.4s cubic-bezier(0.7,0,1,1)';
      overlay.style.opacity = '1';
      overlay.style.pointerEvents = 'all';
      setTimeout(() => { window.location.href = href; }, 420);
    });
  });

  
  const cards = document.querySelectorAll('.card');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.15 });
  cards.forEach(c => obs.observe(c));

  
  cards.forEach(card => {
    card.addEventListener('pointerdown', e => {
      const r = document.createElement('span');
      const rect = card.getBoundingClientRect();
      r.style.cssText = `position:absolute;left:${e.clientX-rect.left}px;top:${e.clientY-rect.top}px;width:10px;height:10px;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:rgba(255,255,255,0.15);pointer-events:none;animation:rippleOut 0.6s cubic-bezier(0.23,1,0.32,1) forwards;`;
      card.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    });
  });
  const s = document.createElement('style');
  s.textContent = '@keyframes rippleOut{to{transform:translate(-50%,-50%) scale(18);opacity:0;}}';
  document.head.appendChild(s);
</script>
</body>
</html>
